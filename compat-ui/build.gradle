//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument
dependencies {
	implementation project(path: ":core", configuration: "namedElements")
	implementation project(path: ":client", configuration: "namedElements")
	implementation project(path: ":compat", configuration: "namedElements")
	implementation project(path: ":ui", configuration: "namedElements")
	modImplementation libs.fapi

	modCompileOnly libs.calio
	modCompileOnly(libs.origins) {
		exclude group: 	"org.ladysnake.cardinal-components-api"
		exclude module: "apoli"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/${compatUiId}.accesswidener")
}
